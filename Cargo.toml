[package]
name = "gray-questions"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "User-question sidecar plugin for the gray agent harness (wire v1)."

[[bin]]
name = "questions"
path = "src/main.rs"

[lib]
name = "gray_questions"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
