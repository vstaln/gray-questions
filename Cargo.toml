[package]
name = "gray-questions"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Structured clarifying questions for interactive agent sessions"

[[bin]]
name = "questions"
path = "src/main.rs"

[lib]
name = "gray_questions"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

# Dev builds: full DWARF bloats the binary and every edit pays the link.
# Line tables keep file:line in panics and backtraces; deps carry none
# (nobody steps into tokio). Need a debugger? CARGO_PROFILE_DEV_DEBUG=2
# for that one build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
